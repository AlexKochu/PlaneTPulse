services:
  - type: web
    name: planetpulse-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        value: sqlite:///./planetpulse.db
        # ⚠️  SQLite is ephemeral on Render free tier — data resets on restart.
        # For persistence: create a Render PostgreSQL DB and paste its URL here.
      - key: FRONTEND_URL
        value: https://plane-t-pulse.vercel.app
        # Update this to your exact Vercel URL (no trailing slash)
      - key: GROQ_API_KEY
        sync: false
        # ⚠️  Set this manually in the Render Dashboard under Environment Variables.
        # Do NOT commit the actual key here.
