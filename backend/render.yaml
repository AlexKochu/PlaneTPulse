services:
  - type: web
    name: planetpulse-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        value: sqlite:///./planetpulse.db # Change this to PostgreSQL URL in Render dashboard later
      - key: FRONTEND_URL
        value: https://your-vercel-app-url.vercel.app # Update this after Vercel deployment
    # Note: On Render free tier, SQLite data will be lost on restarts. 
    # For persistence, upgrade to a Render PostgreSQL database and update DATABASE_URL.
